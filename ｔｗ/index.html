  cyc.oninput = e => { state.cycle = e.target.value === '' ? '' : Number(e.target.value); save(); };
  cyc.onchange = e => {                     /* 1未満を入れても計算は3になるので、欄の数字も合わせる */
    const v = num(e.target.value);
    state.cycle = (v === null || v < 1) ? 3 : Math.round(v);
    e.target.value = state.cycle; save();
  };
  const saf = document.getElementById('setSafety');
  saf.oninput = e => { state.safety = e.target.value === '' ? 0 : Number(e.target.value); save(); };
  saf.onchange = e => {
    const v = num(e.target.value);
    state.safety = (v === null || v < 0) ? 0 : v;
    e.target.value = state.safety; save();
  };
  document.getElementById('sugCalc').onclick = renderSuggest;
  document.getElementById('restHist').onclick = e => restoreHistory(e.currentTarget);
  document.getElementById('setLineOn').onchange = e => { state.lineOn = e.target.checked; save(); };
  document.getElementById('lineTestBtn').onclick = e => lineTest(e.currentTarget);
  document.getElementById('mstPushBtn').onclick = e => pushMaster(e.currentTarget);
  document.getElementById('mstImpFile').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => { document.getElementById('mstImpTxt').value = String(r.result || ''); };
    r.readAsText(f, 'utf-8');
  };
  document.getElementById('mstImpBtn').onclick = () => importMaster(document.getElementById('mstImpTxt').value);
  document.getElementById('mstPullBtn').onclick = async e => {
    const b = e.currentTarget, t = b.textContent;
    b.disabled = true; b.textContent = pick('mstLoading');
    try{ await pullMaster({manual:true}); }
    finally{ b.disabled = false; b.textContent = t; }
  };

  document.getElementById('holAdd').onclick = () => {
    const d = document.getElementById('holD').value;
    const n = (document.getElementById('holN').value || '').trim();
    if(!d) return;
    if(!Array.isArray(state.hol)) state.hol = [];
    const label = n || d;
    if(!state.hol.some(h => h.d === d && h.th === label)){
      state.hol.push({d, th: label, ja: label});
      state.hol.sort((a, b) => a.d < b.d ? -1 : 1);
      save();
    }
    renderMaster(); renderHolBar();
  };
  app.querySelectorAll('[data-holdel2]').forEach(b => {
    b.onclick = () => {
      state.hol = (state.hol || []).filter(h => !(h.d === b.dataset.holdel2 && h.th === b.dataset.n));
      save(); renderMaster(); renderHolBar();
    };
  });
  app.querySelectorAll('[data-holy]').forEach(b => {
    b.onclick = () => {
      const n = addHolidayYear(Number(b.dataset.holy));
      save(); renderMaster(); renderHolBar();
      toast(pick('holAdded').replace(/%n/g, n));
    };
  });
  document.getElementById('holClearBtn').onclick = () => {
    if(!confirm(pick('holClearOk'))) return;
    state.hol = []; save(); renderMaster(); renderHolBar();
  };
  document.getElementById('chkUpd').onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = pick('updChecking');
    const r = await checkForUpdate(true);
    if(r === 'updating') return;                       /* 読み込み直すのでここで終わり */
    btn.disabled = false; btn.textContent = pick('updCheck');
    toast(pick(r === 'offline' ? 'updOffline' : 'updLatest'));
  };

  document.getElementById('pinSave').onclick = () => {
    const cur = document.getElementById('pinCur');
    if(lockOn() && !pinCheck(cur ? cur.value : '')){ toast(pick('lockWrong')); return; }
    const a = (document.getElementById('pinNew').value || '').trim();
    const b = (document.getElementById('pinNew2').value || '').trim();
    if(!/^[0-9]{4,8}$/.test(a)){ toast(pick('lockBadDigits')); return; }
    if(a !== b){ toast(pick('lockMismatch')); return; }
    const was = lockOn();
    state.pin = makePin(a); save(); flushSave();
    unlocked = true; pinFailSet(0); pinWaitSet(0);
    toast(pick(was ? 'lockChanged' : 'lockEnabled'));
    renderMaster();
  };
  const pinOffBtn = document.getElementById('pinOff');
  if(pinOffBtn) pinOffBtn.onclick = () => {
    const cur = document.getElementById('pinCur');
    if(!pinCheck(cur ? cur.value : '')){ toast(pick('lockWrong')); return; }
    state.pin = null; save(); flushSave();
    unlocked = true; pinFailSet(0); pinWaitSet(0);
    toast(pick('lockDisabled'));
    renderMaster();
  };

  app.querySelectorAll('[data-sf2]').forEach(el => {
    el.oninput = () => { const s = state.suppliers.find(x => x.id === el.dataset.id); if(s){ s[el.dataset.sf2] = el.value; save(); } };
  });
  app.querySelectorAll('[data-sf2n]').forEach(el => {
    el.oninput = () => { const s = state.suppliers.find(x => x.id === el.dataset.id); if(s){ s[el.dataset.sf2n] = el.value === '' ? '' : Number(el.value); save(); } };
  });
  app.querySelectorAll('[data-day]').forEach(b => {
    b.onclick = () => {
      const s = state.suppliers.find(x => x.id === b.dataset.id);
      const d = Number(b.dataset.day);
      s.closed = (s.closed||[]).includes(d) ? s.closed.filter(x => x !== d) : [...(s.closed||[]), d].sort();
      b.setAttribute('aria-pressed', String(s.closed.includes(d)));
      save();
      const sm = b.closest('details').querySelector('.s');
      sm.innerHTML = `${esc(restLabel(s) || pick('noClosed'))}${s.cutoff ? ' / '+esc(s.cutoff) : ''}<br>${L.nextOrderDay[state.lang==='ja'?1:0]}${dateLabel(nextOrderDate(s))}`;
    };
  });
  app.querySelectorAll('[data-holadd]').forEach(b => {
    b.onclick = () => {
      const s = state.suppliers.find(x => x.id === b.dataset.holadd);
      const inp = app.querySelector(`[data-hol="${s.id}"]`);
      if(!inp.value) return;
      if(!s.holidays.includes(inp.value)) s.holidays.push(inp.value);
      save(); reopenMaster(s.id);
    };
  });
  app.querySelectorAll('[data-holdel]').forEach(b => {
    b.onclick = () => {
      const s = state.suppliers.find(x => x.id === b.dataset.holdel);
      s.holidays = s.holidays.filter(d => d !== b.dataset.d);
      save(); reopenMaster(s.id);
    };
  });
  app.querySelectorAll('[data-supdel]').forEach(b => {
    b.onclick = () => {
      const s = state.suppliers.find(x => x.id === b.dataset.supdel);
      const n = state.items.filter(i => i.supId === s.id).length;
      if(!confirm(`${s.name} — ${n} ${L.items[0]}?`)) return;
      state.items.forEach(i => { if(i.supId === s.id) i.supId = ''; });
      state.suppliers = state.suppliers.filter(x => x.id !== s.id);
      if(state.supFilter === s.id) state.supFilter = null;
      save(); renderMaster();
    };
  });
  document.getElementById('addSup').onclick = () => {
    const id = 's' + Date.now().toString(36);
    state.suppliers.push({id, name:'新廠商', nameJa:'新しい仕入先', url:'', phone:'', email:'', note:'', closed:[0], holidays:[], cutoff:''});
    save(); reopenMaster(id, true);
  };
  document.getElementById('addUnitBtn').onclick = () => {
    const inp = document.getElementById('newUnitInput');
    const v = (inp.value || '').trim();
    if(!v) return;
    if(!state.units.includes(v)) state.units.push(v);
    save(); renderMaster();
  };
  app.querySelectorAll('[data-unitdel]').forEach(b => {
    b.onclick = () => {
      state.units = (state.units||[]).filter(u => u !== b.dataset.unitdel);
      save(); renderMaster();
    };
  });
  app.querySelectorAll('[data-f]').forEach(el => {
    const h = ev => {
      const it = state.items.find(x => x.id === el.dataset.id);
      if(!it) return;
      const f = el.dataset.f;
      if(['par','lot','price'].includes(f)){
        /* 数字の欄。打ち直し中の空欄では上書きせず、欄を離れたときに範囲を直す。
           入数（lot）を0にするとロット換算が全部狂うため、1を下限にする。 */
        const raw = String(el.value).trim();
        if(raw === ''){ if(ev && ev.type === 'input') return; }
        let v = num(raw);
        if(v === null || !isFinite(v) || v < 0) v = 0;
        if(f === 'lot' && !(v > 0)) v = 1;
        it[f] = v;
        if(ev && ev.type !== 'input' && String(v) !== raw) el.value = v;
      } else it[f] = el.value;
      /* 基準在庫や入数を触ったら、横の実量表示もその場で合わせる */
      if(['par','lot'].includes(f)){
        const eq = app.querySelector(`[data-eq="${it.id}"]`);
        if(eq) eq.textContent = parEqText(it);
      }
      save();
    };
    el.oninput = h; el.onchange = h;
  });
  app.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      if(!confirm(pick('confirmDelItem'))) return;
      state.items = state.items.filter(x => x.id !== b.dataset.del);
      delete state.counts[b.dataset.del]; delete state.prev[b.dataset.del];
      save(); renderMaster();
    };
  });
  document.getElementById('addItem').onclick = () => {
    const id = 'i' + Date.now().toString(36);
    const sid = state.supFilter || (state.suppliers[0]||{}).id || '';
    const sup = state.suppliers.find(x => x.id === sid);
    state.items.push({id, cat: sup ? sup.name : '', name:'新品項', nameJa:'新しい品目', unit:(state.units||['g'])[0], par:1, lot:1, lotUnit:'', price:0, supId: sid});
    save(); renderMaster();
    const cards = app.querySelectorAll('.mcard');
    const el = cards[cards.length-1];
    el.open = true; el.scrollIntoView({block:'center'}); el.querySelector('input').select();
  };
  document.getElementById('resetAll').onclick = () => {
    if(!confirm(pick('confirmReset'))) return;
    state.counts = {}; state.recordedSig = ''; save(); toast(pick('resetDone'));
  };
  document.getElementById('clearHist').onclick = () => {
    if(!confirm(pick('confirmHist'))) return;
    state.history = []; save(); renderMaster(); toast(pick('histCleared'));
  };
}
function reopenMaster(supId, focus){
  renderMaster();
  const el = [...app.querySelectorAll('.mcard')].find(c => c.querySelector(`[data-id="${supId}"]`));
  if(el){ el.open = true; el.scrollIntoView({block:'center'}); if(focus) el.querySelector('input').select(); }
}

/* ---------- 自動更新チェック ----------
   GitHub Pages はHTMLを10分キャッシュするため、更新してもスマホに古い版が残ることがある。
   サーバー側の Last-Modified と、いま動いている文書の document.lastModified を比べ、
   新しければクエリを付けて読み込み直す（＝キャッシュを迂回する）。版番号を手で振る必要はない。 */
const UPD_KEY = 'stock-order-app-updated-to';
let updCheckedAt = 0;
const buildStamp = () => {
  const d = new Date(document.lastModified);
  if(isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};
function applyUpdate(stamp){
  flushSave();
  try{ sessionStorage.setItem(UPD_KEY, String(stamp)); }catch(e){}
  location.replace(location.pathname + '?v=' + stamp);
}
function showUpdBar(stamp){
  const el = document.getElementById('updbar');
  if(!el) return;
  el.innerHTML = `<span class="t">${pick('updNew')}</span>
    <button type="button" id="updGo">${pick('updBtn')}</button>
    <button type="button" class="x" id="updX" aria-label="${pick('updClose')}">✕</button>`;
  el.hidden = false;
  window.scrollTo(0, 0);
  document.getElementById('updGo').onclick = () => applyUpdate(stamp);
  document.getElementById('updX').onclick = () => { el.hidden = true; };
}
async function checkForUpdate(manual){
  const now = Date.now();
  if(!manual && now - updCheckedAt < 60000) return 'skip';
  updCheckedAt = now;
  let lm = null;
  try{
    const res = await fetch(location.pathname + '?t=' + now, {method:'HEAD', cache:'no-store'});
    if(res.ok) lm = res.headers.get('last-modified');
  }catch(e){ return 'offline'; }
  if(!lm) return 'unknown';
  const server = new Date(lm).getTime();
  const mine = new Date(document.lastModified).getTime();
  if(isNaN(server) || isNaN(mine) || server - mine <= 2000) return 'latest';
  if(manual){ applyUpdate(server); return 'updating'; }
  let tried = null;
  try{ tried = sessionStorage.getItem(UPD_KEY); }catch(e){}
  if(tried === String(server)){ showUpdBar(server); return 'bar'; }   /* 一度やり直しても古いまま → 自動では繰り返さない */
  applyUpdate(server);
  return 'updating';
}

/* ---------- 共通 ---------- */
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const storeTitle = document.getElementById('storeTitle');
/* 設定画面のアコーディオン開閉状態。保存はしない（毎回すべて閉じた状態からで良い項目もあるため）。
   基本設定・マスタの共有だけ最初から開いておく。 */
let secOpen = {basic:true, line:false, master:true, lock:false, unit:false, sugg:false, hol:false, sup:false, item:false};
function bindSecAcc(){
  app.querySelectorAll('details[data-sec]').forEach(d => {
    d.ontoggle = () => { secOpen[d.dataset.sec] = d.open; };
  });
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dateStr(){ const d = new Date(); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${wd(d.getDay())})`; }
function applyLang(){ document.body.className = state.lang === 'both' ? '' : 'lang-' + state.lang; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function copy(text){
  const done = () => toast(pick('copied'));
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast(pick('copyFail')); }
    ta.remove();
  }
}
function go(v){
  if(view === 'master' && v !== 'master') unlocked = false;   /* 設定画面から離れたら再びロックする */
  view = v;
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav === v)));
  window.scrollTo(0,0);
  renderHolBar();
  if(v === 'count') renderCount();
  else if(v === 'recv') renderRecv();
  else if(v === 'result') renderResult();
  else if(lockOn() && !unlocked) renderLock();
  else renderMaster();
}
app.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.recv){
    const p = state.prev[t.dataset.recv];
    if(p){
      const v = num(t.value);
      p.received = v === null ? null : Math.max(0, v);      /* マイナスは0扱い */
      save(); updateRecvRow(t);
    }
    return;
  }
  if(!t.dataset.count) return;
  const c = num(t.value);
  state.counts[t.dataset.count] = c === null ? '' : String(Math.max(0, c));
  save(); updateRow(t);
});
app.addEventListener('click', e => {
  const rb = e.target.closest('[data-rstep]');
  if(rb){
    const input = app.querySelector(`[data-recv="${rb.dataset.rid}"]`);
    const p = state.prev[rb.dataset.rid];
    if(!input || !p) return;
    const cur = num(input.value);
    const next = Math.max(0, round2((cur === null ? Number(p.order || 0) : cur) + Number(rb.dataset.rstep)));
    input.value = next; p.received = next;
    save(); updateRecvRow(input);
    return;
  }
  const b = e.target.closest('[data-step]');
  if(!b) return;
  const input = app.querySelector(`[data-count="${b.dataset.id}"]`);
  const next = Math.max(0, round2((num(input.value) ?? 0) + Number(b.dataset.step)));
  input.value = next; state.counts[b.dataset.id] = String(next);
  save(); updateRow(input);
});
/* 画面上部の進捗バーの数字と帯を書き換える。
   入力のたびにここを通さないと、画面を描き直すまで 0 のまま止まる */
function updateProgress(s){
  const wrap = app.querySelector('.progresswrap');
  if(!wrap) return;
  const st = s || summary();
  const pct = st.total ? Math.round(st.counted / st.total * 100) : 0;
  const nums = wrap.querySelectorAll('.prow .num');
  if(nums[0]) nums[0].textContent = `${st.counted} / ${st.total}${L.filled[state.lang==='ja'?1:0]}`;
  if(nums[1]) nums[1].textContent = `${pct}%`;
  const fill = wrap.querySelector('.pfill');
  if(fill) fill.style.width = pct + '%';
}
function updateRow(input){
  const it = state.items.find(x => x.id === input.dataset.count);
  const lots = orderLots(it);
  const row = input.closest('.row');
  const flag = row.querySelector('.flag');
  if(lots === null){ flag.className='flag blank'; flag.textContent = pick('notFilled'); }
  else if(lots > 0){
    flag.className='flag need';
    flag.textContent = `${L.orderN[state.lang==='ja'?1:0]}${lotsLabel(it, lots)}`;
  }
  else { flag.className='flag ok'; flag.textContent = pick('enough'); }
  /* 行の色分けも、描き直しを待たずにここで切り替える */
  row.classList.toggle('need', lots !== null && lots > 0);
  row.classList.toggle('ok', lots === 0);
  const s = summary();
  updateProgress(s);
  const sum = bar.querySelector('.sum');
  if(sum) sum.innerHTML = `<b class="num">${s.counted} / ${s.total}${L.filled[state.lang==='ja'?1:0]}</b>${s.need}${L.shortN[state.lang==='ja'?1:0]}${money(s.amount)}`;
  const g = document.getElementById('toResult');
  if(g) g.disabled = !s.counted;
}
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
(async function init(){
  await load();
  applyLang();
  document.getElementById('today').textContent = dateStr();
  storeTitle.textContent = state.store || '庫存盤點';
  go('count');
  renderHolBar();
  if(clearedOnBoot) toast(pick('recCleared'));
  checkForUpdate();
  /* 起動のたびに共有マスタを見に行く。版が上がっていれば取り込む */
  pullMaster({});
})();
</script>
